name: SpeedTrack checks
on:
  push:
    branches: [integration/pr2-final, main, feature/speedtrack-v2, feature/speedtrack-mejoras-paralelas]
  pull_request:
    branches: [integration/pr2-final, main, feature/speedtrack-v2, feature/speedtrack-mejoras-paralelas]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
